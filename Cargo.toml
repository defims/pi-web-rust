[package]
name = "pi-web-rust"
version = "0.8.7"
edition = "2021"
license = "MIT"
description = "Rust backend for pi-web (agegr/pi-web), referencing pi_agent_rust"

[lib]
name = "pi_web_rust"
path = "src/lib.rs"

[dependencies]
# pi 引擎(defims fork,对齐 earendil-works/pi TS SDK)
pi_agent_rust = { path = "../pi-agent-rust" }
# 序列化(对齐上游 JSON 形状)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# async IO(运行时无关:oneshot channel 用于 thread spawn 回传结果)
futures = "0.3"
# 时间格式化(ISO 8601,对齐 TS new Date().toISOString())
chrono = "0.4"
# SHA256(timing-safe 密码比较,对齐 lib/web-auth.ts)
sha2 = "0.10"
# 正则(compaction 摘要解析,对齐 lib/compaction-summary.ts)
regex = "1"
# UUID v4(原子写入临时文件名,对齐 TS crypto.randomUUID())
uuid = { version = "1", features = ["v4"] }
# unix 常量(O_NOFOLLOW,对齐 lib/bash-output.ts 的 openRegularFileNoFollow)
libc = "0.2"

[dev-dependencies]
# 仅测试用 async runtime
tokio = { version = "1", features = ["macros", "rt", "time"] }

# pi-web-rust 作为 moho-mate 的 path dependency(与 pi-agent-rust 一致,无 [workspace])
