[package]
name = "pi-web-rust"
version = "0.8.7"
edition = "2021"
license = "MIT"
description = "Rust backend for pi-web (agegr/pi-web), referencing pi_agent_rust"

[lib]
name = "pi_web_rust"
path = "src/lib.rs"

[dependencies]
# pi 引擎(defims fork,对齐 earendil-works/pi TS SDK)
pi_agent_rust = { path = "../pi-agent-rust" }
# 序列化(对齐上游 JSON 形状)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# async IO(运行时无关:oneshot channel 用于 thread spawn 回传结果)
futures = "0.3"

[dev-dependencies]
# 仅测试用 async runtime
tokio = { version = "1", features = ["macros", "rt"] }

# 排除 moho-mate workspace(submodule 独立编译)
[workspace]
