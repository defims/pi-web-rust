[package]
name = "picrab-web"
version = "0.8.7"
edition = "2021"
license = "MIT"
description = "Rust backend for pi-web (agegr/pi-web), referencing picrab (lib pi)"

[lib]
name = "picrab_web"
path = "src/lib.rs"

[features]
# api:嵌入契约层(src/api/,docs/api-embed-plan.md 在宿主仓库)。
# 默认关闭 —— 纯逻辑库形态不受影响;嵌入宿主(moho-mate)启用。
api = ["dep:http", "dep:asupersync", "dep:tokio"]

[dependencies]
# pi 引擎(defims fork,对齐 earendil-works/pi TS SDK)
picrab = { path = "../picrab" }
# 序列化(对齐上游 JSON 形状)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# async IO(运行时无关:oneshot channel 用于 thread spawn 回传结果)
futures = "0.3"
# 时间格式化(ISO 8601,对齐 TS new Date().toISOString())
chrono = "0.4"
# SHA256(timing-safe 密码比较,对齐 lib/web-auth.ts)
sha2 = "0.10"
# 正则(compaction 摘要解析,对齐 lib/compaction-summary.ts)
regex = "1"
# UUID v4(原子写入临时文件名,对齐 TS crypto.randomUUID())
uuid = { version = "1", features = ["v4"] }
# unix 常量(O_NOFOLLOW,对齐 lib/bash-output.ts 的 openRegularFileNoFollow)
libc = "0.2"
# ── api feature 专用 ──
# 传输方言(http::Request/Response;与 wry/axum 同源)
http = { version = "1", optional = true }
# 引擎运行时(宿主注入 Arc<Runtime>;版本与 picrab 的 asupersync 统一)
asupersync = { version = "0.3.9", default-features = false, optional = true }
# 仅 sync 原语(oneshot/mpsc,运行时无关 —— chat_thread 已验证可在 asupersync
# 任务内 await);不引入 tokio runtime(计划"无 tokio"指运行时,非原语)
tokio = { version = "1", features = ["sync"], optional = true }

[dev-dependencies]
# 仅测试用 async runtime
tokio = { version = "1", features = ["macros", "rt", "time"] }
# 仅测试用临时目录(cwd/default-cwd 命令测试)
tempfile = "3"

# picrab-web 作为 moho-mate 的 path dependency(与 picrab 一致,无 [workspace])
